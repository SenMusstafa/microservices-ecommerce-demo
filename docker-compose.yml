# Whole system with one command:  docker compose up --build
# The database is NOT in here — it lives on Neon; credentials come from .env
# (copy .env.example to .env first).

x-spring-common: &spring-common
  restart: on-failure
  environment: &spring-env
    SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
    EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ZIPKIN_URL: http://zipkin:9411/api/v2/spans

services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "29092:29092"   # for tools running on the host; containers use kafka:9092
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

  zipkin:
    image: openzipkin/zipkin:3
    container_name: zipkin
    ports:
      - "9411:9411"   # trace UI

  discovery-service:
    build: { context: ., args: { MODULE: discovery-service } }
    image: ghcr.io/sensmusstafa/discovery-service:latest
    container_name: discovery-service
    restart: on-failure
    ports:
      - "8761:8761"     # Eureka dashboard
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8761'"]
      interval: 5s
      retries: 20

  config-service:
    build: { context: ., args: { MODULE: config-service } }
    image: ghcr.io/sensmusstafa/config-service:latest
    container_name: config-service
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8888'"]
      interval: 5s
      retries: 20

  legacy-soap-service:
    build: { context: ., args: { MODULE: legacy-soap-service } }
    image: ghcr.io/sensmusstafa/legacy-soap-service:latest
    container_name: legacy-soap-service
    restart: on-failure
    ports:
      - "8090:8090"     # SOAP endpoint (try http://localhost:8090/ws?wsdl)

  inventory-service:
    <<: *spring-common
    build: { context: ., args: { MODULE: inventory-service } }
    image: ghcr.io/sensmusstafa/inventory-service:latest
    container_name: inventory-service
    environment:
      <<: *spring-env
      DB_URL: ${DB_URL:?copy .env.example to .env and fill it in}
      DB_USER: ${DB_USER:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      LEGACY_WAREHOUSE_URL: http://legacy-soap-service:8090/ws
    depends_on:
      config-service: { condition: service_healthy }
      discovery-service: { condition: service_healthy }
      legacy-soap-service: { condition: service_started }

  order-service:
    <<: *spring-common
    build: { context: ., args: { MODULE: order-service } }
    image: ghcr.io/sensmusstafa/order-service:latest
    container_name: order-service
    environment:
      <<: *spring-env
      DB_URL: ${DB_URL:?copy .env.example to .env and fill it in}
      DB_USER: ${DB_USER:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
    depends_on:
      config-service: { condition: service_healthy }
      discovery-service: { condition: service_healthy }
      kafka: { condition: service_healthy }

  notification-service:
    <<: *spring-common
    build: { context: ., args: { MODULE: notification-service } }
    image: ghcr.io/sensmusstafa/notification-service:latest
    container_name: notification-service
    depends_on:
      config-service: { condition: service_healthy }
      discovery-service: { condition: service_healthy }
      kafka: { condition: service_healthy }

  gateway-service:
    build: { context: ., args: { MODULE: gateway-service } }
    image: ghcr.io/sensmusstafa/gateway-service:latest
    container_name: gateway-service
    restart: on-failure
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    ports:
      - "8080:8080"
    depends_on:
      discovery-service: { condition: service_healthy }

  frontend:
    build: ./frontend
    image: ghcr.io/sensmusstafa/frontend:latest
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway-service
