spring.application.name=notification-service
server.port=0

spring.config.import=optional:configserver:http://localhost:8888
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.mustafasen.notificationservice.events
spring.kafka.consumer.properties.spring.json.value.default.type=com.mustafasen.notificationservice.events.OrderCreatedEvent
# The producer lives in another service, so its class name in the type header
# can't be trusted/resolved here; always deserialize into our own event class.
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Distributed tracing -> Zipkin (http://localhost:9411). Sample everything: it's a demo.
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
spring.kafka.listener.observation-enabled=true
